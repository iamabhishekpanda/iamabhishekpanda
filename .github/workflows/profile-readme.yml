name: Refresh profile intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "17 0 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-readme.mjs"
      - ".github/workflows/profile-readme.yml"

permissions:
  contents: write

jobs:
  repositories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate live portfolio dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.mjs
      - name: Commit refreshed portfolio
        run: |
          if git diff --quiet assets/abhishek-panda-portfolio.svg; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/abhishek-panda-portfolio.svg
          git commit -m "docs: refresh portfolio intelligence"
          git push

  contribution-snake:
    if: github.event_name != 'schedule' || github.event.schedule == '17 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
